name: formsflow-forms to Docker Hub

on:
  push:
    branches: [formsflow-forms, develop]
  workflow_dispatch:

jobs:
  build:  
   runs-on: ubuntu-latest
   permissions:
    contents: read
    id-token: write  
   
   steps:

      - name: Check Out Repo 
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2
        
      - name: Set version
        if: ${{ github.ref != 'refs/heads/formsflow-forms' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Set version (formsflow-forms branch)
        if: ${{ github.ref == 'refs/heads/formsflow-forms' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          VER=${VER/-alpha/''}
          echo "VERSION=$VER" >> $GITHUB_ENV
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@2af9c6a52b5431eea749f0e923b7503b84813f77
        with:
          images: formsflow/forms-flow-forms
          tags: ${{ env.VERSION }}
      - run: echo ${{ env.VERSION }}
      
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@56744aa47577854fb24ebdf67fce890ee83d9d41
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 3600
      - name: Docker login
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
         username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
         password: ${{ steps.docker_oidc.outputs.token }}
          
      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.name }}
            
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      
      - name: Build and push
        if: ${{ github.ref != 'refs/heads/formsflow-forms' }}
        id: docker_build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: formsflow/forms-flow-forms:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (formsflow-forms branch)
        if: ${{ github.ref == 'refs/heads/formsflow-forms' }}
        id: docker_build_latest
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: formsflow/forms-flow-forms:${{ env.VERSION }}, formsflow/forms-flow-forms:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
      - name: Notify Google Chat - Success
        if: ${{ success() }}
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.DOCKER_HUB_DEPLOY_GOOGLE_CHAT_WEBHOOK_URL }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          curl --fail-with-body -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$(jq -n \
              --arg repository "${{ github.repository }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg tags "$IMAGE_TAGS" \
              --arg actor "${{ github.actor }}" \
              --arg sha "${{ github.sha }}" \
              --arg workflow "${{ github.workflow }}" \
              --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                text: (
                  "🐳 *Docker Image Released Successfully* 🚀\n\n" +
                  "*Repository:* " + $repository + "\n" +
                  "*Branch:* " + $branch + "\n" +
                  "*Image:* " + $tags + "\n" +
                  "*Commit:* " + $sha + "\n" +
                  "*Triggered by:* " + $actor + "\n\n" +
                  "🔗 " + $run_url
                )
              }')" \
            "$GOOGLE_CHAT_WEBHOOK_URL"

      - name: Notify Google Chat - Failure
        if: ${{ failure() }}
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.DOCKER_HUB_DEPLOY_GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          curl --fail-with-body -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$(jq -n \
              --arg repository "${{ github.repository }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg actor "${{ github.actor }}" \
              --arg workflow "${{ github.workflow }}" \
              --arg run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                text: (
                  "❌ *Docker Image Release Failed*\n\n" +
                  "*Repository:* " + $repository + "\n" +
                  "*Branch:* " + $branch + "\n" +
                  "*Workflow:* " + $workflow + "\n" +
                  "*Triggered by:* " + $actor + "\n\n" +
                  "🔗 Check the workflow:\n" + $run_url
                )
              }')" \
            "$GOOGLE_CHAT_WEBHOOK_URL"  
        
        
      
  
