name: formsflow-forms to Docker Hub

on:
  push:
    branches: [formsflow-forms, develop]
  workflow_dispatch:
  
jobs:
  build:  
   runs-on: ubuntu-latest
   permissions:
    contents: read
    id-token: write  
   
   steps:

      - name: Check Out Repo 
        uses: actions/checkout@v4
        
      - name: Set version
        if: ${{ github.ref != 'refs/heads/formsflow-forms' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> $GITHUB_ENV
      - name: Set version
        if: ${{ github.ref == 'refs/heads/formsflow-forms' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          VER=${VER/-alpha/''}
          echo "VERSION=$VER" >> $GITHUB_ENV
      
      - run: echo ${{ env.VERSION }}
      
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@v1
        with:
          connection-id: c2bcb09e-a4bb-4bc4-8a37-2b3d3348e40d
          expires-in: 3600
      - name: Docker login
        uses: docker/login-action@v4
        with:
         username: formsflow
         password: ${{ steps.docker_oidc.outputs.token }}
          
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.name }}
            
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push
        if: ${{ github.ref != 'refs/heads/formsflow-forms' }}
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: formsflow/forms-flow-forms:${{ env.VERSION }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
      - name: Build and push
        if: ${{ github.ref == 'refs/heads/formsflow-forms' }}
        id: docker_build_latest
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: formsflow/forms-flow-forms:${{ env.VERSION }}, formsflow/forms-flow-forms:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
        
        
      
  
