name: CI - formsflow-forms

on:
  workflow_dispatch:

  push:
    branches:
      - formsflow-forms

  pull_request:
    branches:
      - develop
      - formsflow-forms 

defaults:
  run:
    shell: bash

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version:
          - "22.x"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          npm run lint

  test:
    name: Unit Test
    needs: lint
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version:
          - "22.x"

    services:
      mongodb:
        image: mongo:5
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run tests
        env:
          ROOT_EMAIL: admin@example.com
          ROOT_PASSWORD: Changeme1!
        run: |
          npm test

  build:
    name: Build
    needs:
      - lint
      - test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: |
          docker build \
            --tag forms-flow-forms:ci \
            .

      - name: Verify Docker image
        run: |
          docker image inspect forms-flow-forms:ci

  trivy:
    name: Trivy Security Scan
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: |
          docker build \
            --tag forms-flow-forms:ci \
            .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: forms-flow-forms:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  snyk:
    name: Snyk Security Scan
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true

    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        node-version:
          - "22.x"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Snyk
        run: |
          npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth "$SNYK_TOKEN"

      - name: Snyk Open Source
        continue-on-error: true
        run: |
          snyk test \
            --file=package-lock.json \
            --package-manager=npm \
            --severity-threshold=high

      - name: Snyk Code
        continue-on-error: true
        run: |
          snyk code test \
            --severity-threshold=high
