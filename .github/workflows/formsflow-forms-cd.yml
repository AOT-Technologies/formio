name: formsflow-forms to Docker Hub

on:
  push:
    branches: [formsflow-forms, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Set version (develop branch)
        if: ${{ github.ref != 'refs/heads/formsflow-forms' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Set version (formsflow-forms branch)
        if: ${{ github.ref == 'refs/heads/formsflow-forms' }}
        working-directory: .
        run: |
          VER=$(cat VERSION)
          VER=${VER/-alpha/''}
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Print version
        run: echo ${{ env.VERSION }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (develop branch)
        if: ${{ github.ref != 'refs/heads/formsflow-forms' }}
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: formsflow/forms-flow-forms:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (formsflow-forms branch)
        if: ${{ github.ref == 'refs/heads/formsflow-forms' }}
        id: docker_build_latest
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: formsflow/forms-flow-forms:${{ env.VERSION }}, formsflow/forms-flow-forms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
